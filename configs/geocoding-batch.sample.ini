; Copy outside the repository. No batch API calls are enabled by this sample.
; Manual and batch MUST share this state directory, on one machine only.
[manual]
endpoint = "https://nominatim.openstreetmap.org/search"
user_agent = ""
state_dir = "/var/lib/dewawi/manual-geocoding"

[batch]
enabled = false
; This is a resource limit per selection page, never an API estimate or total cap.
; Use selection_page.next_after / --after to reach the entire older inventory.
selection_page_size = 1000
daily_limit = 500
; Written service-use approval covering this bulk run and its rate/volume is required.
usage_approval_reference = ""
; Record the internal privacy clearance for public, non-personal, non-confidential data.
privacy_approval_reference = ""
; Exact UTC timestamp, e.g. YYYY-MM-DDTHH:MM:SSZ. No validity is assumed by default.
approval_valid_until = ""
