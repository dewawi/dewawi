; Copy outside the web root, restrict access to the operator and set actual values.
; The CLI never loads the application configuration implicitly.
[migration]
resources.db.adapter = Pdo_Mysql
resources.db.params.host = localhost
resources.db.params.unix_socket = /run/mysqld/mysqld.sock
resources.db.params.username = migration_operator
resources.db.params.password = ""
resources.db.params.dbname = dewawi
resources.db.params.charset = utf8mb4
