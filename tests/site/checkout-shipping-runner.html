<!doctype html><html><body><iframe style="height:1800px;border:0"></iframe><pre id="metrics"></pre><script>
(async function () {
 const frame=document.querySelector('iframe'),query=new URLSearchParams(location.search),width=Number(query.get('width')),lang=query.get('lang'),mode=query.get('mode');
 frame.style.width=width+'px';let checks=0,failures=[];
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 function check(value,message){checks++;if(!value)failures.push(message)}
 async function until(fn,message){for(let i=0;i<60;i++){if(fn())return;await wait(60)}throw new Error(message)}
 async function load(path){await new Promise(resolve=>{frame.onload=resolve;frame.src=path});await wait(100)}
 try {
  await load('/a/checkout?lang='+lang);
  let w=frame.contentWindow,$=w.jQuery,d=w.document;
  const config=JSON.parse($('#shop-cart-state').attr('data-config'));
  await $.ajax({url:config.addUrl,method:'POST',dataType:'json',data:{id:103,quantity:mode==='quote'?'2.5':'1',csrf_token:config.token,revision:config.revision}});
  await load('/a/checkout');w=frame.contentWindow;$=w.jQuery;d=w.document;
  const $form=$('form#checkout');let posts=0;const ajax=$.ajax;
  $.ajax=function(options){if(options.url==='/a/checkout/send')posts++;return ajax.apply(this,arguments)};
  Object.entries({billingname:'Shipping browser',billingstreet:'Shipping road 1',billingpostcode:'10115',billingcity:'Berlin',billingcountry:'DE',email:'shipping@example.com'}).forEach(([name,val])=>$form.find('[name="'+name+'"]').val(val).trigger('input'));
  $form.find('[name="privacy"][type="checkbox"]').prop('checked',true).trigger('change');
  check(posts===0,'Typing triggered shipping requests');
  check($form.find('[name="shippingmethod"] option[value="pickup"]').length===1,'Enabled collection absent');
  async function review(){const count=posts;$form[0].requestSubmit($form.find('[data-checkout-fields] button[type="submit"]')[0]);await until(()=>posts>count&&$form.find('[name="checkout_stage"]').val()==='confirm'&&$form.attr('aria-busy')!=='true','Shipping review failed')}
  await review();
  const text=()=>$form.find('#checkout-review').text();
  check(!/SHOPS_/.test(text()),'Unresolved translations');
  check(d.documentElement.scrollWidth<=w.innerWidth,'Shipping review overflows');
  if(mode==='quote'){
   check($form.find('[data-checkout-confirm]').length===0&&$form.find('[name="checkout_quote"]').length===1,'Quote-only cart has no inquiry action or allows an order');
   check(!/€/.test($form.find('[data-checkout-shipping]').text()),'Unknown freight shown as a price');
   $form.find('[name="checkout_quote"]')[0].click();
   await until(()=>frame.contentWindow.location.pathname==='/a/contact/success'&&frame.contentDocument.querySelector('#success'),'Shipping inquiry failed');
   check(frame.contentDocument.querySelector('#success').textContent.includes(lang==='en'?'received':'eingegangen'),'Inquiry receipt missing');
  }else{
   check(text().includes(lang==='en'?'133.28':'133,28')&&text().includes(lang==='en'?'12.00':'12,00'),'Delivery total excludes freight');
   check(text().includes(lang==='en'?'Shipping net amount':'Versandkosten netto'),'Localized shipping label missing');
   $form.find('[name="checkout_edit"]').trigger('click');
   $form.find('[name="billingcountry"]').val('AT').trigger('change');await review();
   check(!$form.find('[data-checkout-confirm]').length&&text().includes(lang==='en'?'unavailable':'nicht verfügbar'),'Unavailable country remains orderable');
   check($('[data-checkout-summary]').text().includes(lang==='en'?'unavailable':'nicht verfügbar'),'Sidebar retained stale delivery amounts');
   $form.find('[name="checkout_edit"]').trigger('click');
   $form.find('[name="billingcountry"]').val('DE').trigger('change');
   $form.find('[name="shippingmethod"]').val('pickup').trigger('change');await review();
   check(text().includes(lang==='en'?'119.00':'119,00')&&text().includes(lang==='en'?'Collection':'Selbstabholung'),'Collection was not recalculated');
   $form.find('[name="checkout_edit"]').trigger('click');
   $form.find('[name="shippingmethod"]').val('delivery').trigger('change');await review();
   $form.find('[data-checkout-confirm]')[0].click();
   await until(()=>frame.contentDocument.querySelector('#success'),'Shipping order failed');
   d=frame.contentDocument;
   check(d.querySelector('#success').textContent.includes(lang==='en'?'133.28':'133,28'),'Stored shipping receipt differs');
   check(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth,'Shipping receipt overflows');
  }
 }catch(error){failures.push(String(error.stack||error))}
 document.querySelector('#metrics').textContent=JSON.stringify({checks,failures,width,lang,mode});
})();
</script></body></html>
